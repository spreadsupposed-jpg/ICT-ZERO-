<script>
const $=s=>document.querySelector(s),ic=n=>`<svg class="i"><use href="#${n}"/></svg>`,f=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),sg=n=>(n>=0?'+':'−')+f(Math.abs(n));
let sd=7;const rn=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// المودلات: الاسم | الفريم | الشروط (من منطق المحركات في 04_CODE)
const M=[
['ICT 2022','M5','انحياز HTF واضح|داخل نافذة NY|سحب سيولة (Sweep)|MSS مع Displacement|FVG داخل ساق الإزاحة|أمر Limit عند حافة FVG بنسبة R≥الحد'],

M.forEach((m,i)=>{m.s=m.c.map(()=>false);const k=i==8?m.c.length:Math.floor(rn()*(m.c.length+1))%m.c.length;for(let j=0;j<k;j++)m.s[j]=true;m.d=i==8?1:(rn()<.5?1:-1)});
